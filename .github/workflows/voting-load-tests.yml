name: Voting Load Tests (Emulator)
on:
  workflow_dispatch:
  push:
    paths:
      - 'test-voting-load.cjs'
      - '.github/workflows/voting-load-tests.yml'
permissions:
  contents: read
jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install test dependencies
        run: npm install --no-save --package-lock=false firebase-admin@14.5.0 firebase-tools@15.34.2
      - name: Create isolated emulator config
        run: |
          printf '%s\n' '{"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false}},"firestore":{"rules":"firestore.load-test.rules"}}' > firebase.load-test.json
          printf '%s\n' 'rules_version = "2";' 'service cloud.firestore {' '  match /databases/{database}/documents {' '    match /{document=**} { allow read, write: if false; }' '  }' '}' > firestore.load-test.rules
      - name: Test 10, 50 and 100 simultaneous writes
        env:
          GCLOUD_PROJECT: demo-voting-load
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: npx firebase emulators:exec --only firestore --project demo-voting-load --config firebase.load-test.json 'node test-voting-load.cjs'

