name: Voting Browser Draft Tests
on:
  push:
    paths:
      - 'voting-2026-2027.js'
      - 'test-voting-browser.cjs'
      - '.github/workflows/voting-browser-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    name: Browser test (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test actual voting JavaScript
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: node test-voting-browser.cjs
