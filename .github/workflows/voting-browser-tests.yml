name: Voting Browser Draft Tests
on:
  push:
    paths:
      - 'voting-2026-2027.js'
      - 'test-voting-browser.cjs'
      - '.github/workflows/voting-browser-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test actual voting JavaScript in Chromium
        run: node test-voting-browser.cjs
