name: Voting Security Tests (Emulator)
on:
  workflow_dispatch:
  push:
    paths:
      - 'test-voting-security.cjs'
      - 'firestore.security-test.rules'
      - '.github/workflows/voting-security-tests.yml'
jobs:
  security-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock @firebase/rules-unit-testing@6.0.0 firebase@13.1.0 firebase-tools@15.34.2
      - name: Create isolated emulator configuration
        run: |
          cat > firebase.security-test.json <<'JSON'
          {"firestore":{"rules":"firestore.security-test.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false}}}
          JSON
      - name: Run security tests
        env:
          GCLOUD_PROJECT: demo-voting-security
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: npx firebase emulators:exec --only firestore --project demo-voting-security --config firebase.security-test.json "node test-voting-security.cjs"
