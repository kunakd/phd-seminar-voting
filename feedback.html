<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presenter Feedback 2026/2027</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>body{font-family:Arial,sans-serif;max-width:750px;margin:30px auto;padding:20px;color:#333}header{text-align:center}header img{height:110px}section{border:1px solid #ddd;border-radius:8px;padding:20px;margin:18px 0}input,button{box-sizing:border-box;width:100%;padding:10px;margin:8px 0}button{cursor:pointer}.comment{padding:12px;border-bottom:1px solid #ddd;white-space:pre-wrap}.error{color:#b00020}nav{text-align:center;margin-top:24px}</style></head>
<body><header><img src="logo.jpg" alt="Department logo"><h1>Presenter Feedback</h1><p>Academic Year 2026/2027</p></header>
<section><p>Sign in with the account assigned to your presenter feedback. Only comments about your own presentation are visible. Comments are displayed without voter identities.</p>
<label>Email <input id="email" type="email" autocomplete="email"></label><label>Password <input id="password" type="password" autocomplete="current-password"></label>
<div id="signinControls"><button id="login">Sign in</button></div><button id="logout" hidden>Sign out</button><p id="status" role="status"></p></section>
<section id="panel" hidden><h2 id="presenter"></h2><div id="comments"></div></section><nav><a href="index.html">Voting</a> · <a href="results.html">Results</a></nav>
<script>
const firebaseConfig={apiKey:"AIzaSyA3oSDoF5LC6pweqVinV2ykpJopQwFWulM",authDomain:"phd-seminar-voting.firebaseapp.com",projectId:"phd-seminar-voting",storageBucket:"phd-seminar-voting.firebasestorage.app",messagingSenderId:"1042633812969",appId:"1:1042633812969:web:7fa70745a53338ec5ab978"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
const $=id=>document.getElementById(id);const status=$('status');
$('login').onclick=async()=>{status.textContent='Signing in...';try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);$('password').value='';}catch(e){status.textContent='Sign-in failed. Check your credentials.';}};
$('logout').onclick=()=>auth.signOut();
let loadId=0;
auth.onAuthStateChanged(async user=>{
 const id=++loadId;$('panel').hidden=true;$('comments').replaceChildren();$('logout').hidden=!user;$('signinControls').hidden=!!user;$('password').parentElement.hidden=!!user;$('email').parentElement.hidden=!!user;
 if(!user){status.textContent='Sign in to see your feedback.';return;}
 if(!user.emailVerified){status.textContent='Please verify your email address before accessing feedback.';return;}
 status.textContent='Signed in. Loading your private feedback...';
 try{
  const snap=await db.collection('presenter_feedback_2026_2027').doc(user.uid).get();
  if(id!==loadId)return;
  if(!snap.exists){status.textContent='No feedback has been published for this account yet.';return;}
  const data=snap.data();
  if(!Array.isArray(data.comments)||typeof data.presenter!=='string')throw Error('Invalid feedback format');
  $('presenter').textContent='Anonymous feedback for '+data.presenter;
  if(data.comments.length===0){const p=document.createElement('p');p.textContent='No comments submitted yet.';$('comments').appendChild(p);}
  for(const comment of data.comments){if(typeof comment!=='string')continue;const p=document.createElement('p');p.className='comment';p.textContent=comment;$('comments').appendChild(p);}
  $('panel').hidden=false;status.textContent='Your feedback is ready.';
 }catch(e){if(id===loadId){console.error(e);status.textContent='Unable to load feedback. Please try again later.';}}
});
</script></body></html>
